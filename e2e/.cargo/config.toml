# This crate is host-only test code: it spawns `act` over tokio's process,
# which does not exist on wasm. The component root's .cargo/config.toml
# defaults every build in this tree to wasm32-wasip2 (`just build` relies on
# that), so pin the host target here — a nearer config file wins — and a bare
# `cargo test` in e2e/ does the right thing.
[build]
target = "x86_64-unknown-linux-gnu"
# The machine-wide ~/.cargo/config.toml redirects build-dir to one shared
# /mnt/devenv/tmp/cargo-build. Every component's e2e crate is named "e2e",
# so on that shared dir the most recent build of ANY of them owns the
# fingerprint slot for that name — a `cargo test` here can come back "fresh"
# and run another component's test binary (observed live: this suite once
# executed the archive component's tests). Pin the scaffold's original
# local build dir so this crate's artifacts stay its own.
build-dir = "target"
